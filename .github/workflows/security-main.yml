name: Seguridad (main)

# Suite completa no destructiva del frontend sobre la rama principal.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    name: Suite completa de seguridad
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Análisis estático y escaneo de imagen
        run: bash security/scripts/run-all.sh --static-only

      - name: Subir SARIF a Code Scanning
        if: always() && hashFiles('security/reports/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: security/reports/semgrep.sarif
          category: semgrep

      - name: Publicar resumen
        if: always()
        run: cat security/reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar informes completos
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: security-reports-${{ github.sha }}
          path: |
            security/reports/*.json
            security/reports/*.sarif
            security/reports/*.md
          # Repositorio público: retención corta para acotar la exposición.
          retention-days: 7

  # ---------------------------------------------------------------------------
  # CodeQL: disponible sin coste en repositorios públicos. Complementa a
  # Semgrep, que es el SAST obligatorio del pipeline.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (complementario)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          category: '/language:javascript-typescript'
