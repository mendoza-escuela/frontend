name: Seguridad (main)

# Suite completa no destructiva del frontend sobre la rama principal.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-main-${{ github.ref }}
  cancel-in-progress: false

env:
  # Evita depender de un .env local ignorado durante build y tests en CI.
  # VITE_* es siempre información pública incluida en el bundle.
  VITE_API_URL: /api

jobs:
  full-suite:
    name: Suite completa de seguridad
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configurar npm 11.6.1
        run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Análisis estático y escaneo de imagen
        run: bash security/scripts/run-all.sh

      - name: Subir SARIF a Code Scanning
        if: always() && hashFiles('security/reports/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: security/reports/semgrep.sarif
          category: semgrep

      - name: Publicar resumen
        if: always()
        run: cat security/reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar informes completos
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports-${{ github.sha }}
          path: |
            security/reports/*.json
            security/reports/*.sarif
            security/reports/*.md
          # Repositorio público: retención corta para acotar la exposición.
          retention-days: 7

  # ---------------------------------------------------------------------------
  # CodeQL: disponible sin coste en repositorios públicos. Complementa a
  # Semgrep, que es el SAST obligatorio del pipeline.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (complementario)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:javascript-typescript'
