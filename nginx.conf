# nginx interno del contenedor del frontend: sirve la SPA compilada.
#
# Escucha en 8080 y no en 80 porque la imagen corre como usuario sin
# privilegios (nginxinc/nginx-unprivileged): un proceso no-root no puede
# abrir puertos por debajo de 1024. Ver hallazgo H-07.
#
# CABECERAS DE SEGURIDAD: se emiten acá y no sólo en el reverse proxy de
# producción. Es defensa en profundidad: si el proxy se reconfigura mal o la
# SPA se sirve desde otro lugar, la protección viaja con el contenedor.
# ZAP baseline reportaba 9 advertencias por su ausencia (Fase 9).
#
# Nota sobre nginx: `add_header` dentro de un `location` REEMPLAZA las
# cabeceras heredadas del bloque `server` en lugar de sumarse. Por eso las
# cabeceras de seguridad se repiten en cada location que agrega las suyas.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No revelar la versión de nginx (ZAP 10036).
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:" always;

  # Sonda para el HEALTHCHECK del contenedor y para el orquestador.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 "ok\n";
  }

  # El HTML nunca se cachea: un despliegue nuevo se ve de inmediato.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:" always;
    try_files $uri =404;
  }

  # Los assets de Vite llevan hash en el nombre: cache larga e inmutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|avif|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
